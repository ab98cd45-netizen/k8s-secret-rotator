apiVersion: v1
kind: ServiceAccount
metadata:
  name: rotator-sa

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rotator-role
rules:
  - apiGroups: [""] # Core API
    resources: ["secrets"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"] # Apps API
    resources: ["deployments"]
    verbs: ["patch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rotator-rolebinding
subjects:
  - kind: ServiceAccount
    name: rotator-sa
roleRef:
  kind: Role
  name: rotator-role
  apiGroup: rbac.authorization.k8s.io